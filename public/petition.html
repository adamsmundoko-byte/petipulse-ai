<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetiPulse - Sign The Petition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: system-ui; background: #0f172a; color: white; padding: 20px; max-width: 600px; margin: auto; }
h1 { color: #22c55e; text-align: center; }
.counter { font-size: 2.5em; font-weight: bold; color: #22c55e; text-align: center; display: block; }
input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
button { width: 100%; padding: 14px; background: #22c55e; color: black; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
button:disabled { background: #475569; }
.error { color: #f87171; }
.success { color: #4ade80; }
</style>
</head>
<body>

<h1>Sign The Petition 🇿🇼</h1>
<p><span id="count" class="counter">Loading...</span> People Have Signed</p>

<form id="petitionForm">
  <input type="text" id="name" placeholder="Full Name *" required>
  <input type="email" id="email" placeholder="Email (optional)">
  <input type="tel" id="phone" placeholder="WhatsApp Number +263... (optional)">
  <textarea id="reason" placeholder="Why are you signing? (optional)" rows="3"></textarea>
  <p id="msg"></p>
  <button type="submit" id="btn">Sign Petition</button>
</form>

<script>
const SUPABASE_URL = "https://cyldnghyjmlrebpzasjw.supabase.co" 
const SUPABASE_KEY = "sb_publishable_f23k9yiRL5oD7i6JmoO2UA_RZNYCFe8"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function loadCount() {
  const { count } = await supabase.from('signatures').select('*', { count: 'exact', head: true })
  document.getElementById('count').innerText = count || 0
}
loadCount()

document.getElementById('petitionForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const btn = document.getElementById('btn')
  const msg = document.getElementById('msg')
  const name = document.getElementById('name').value
  const email = document.getElementById('email').value
  const phone = document.getElementById('phone').value
  const reason = document.getElementById('reason').value
  
  if(!email && !phone) {
    msg.innerHTML = '<p class="error">Please provide either Email or WhatsApp Number</p>'
    return
  }
  
  btn.disabled = true
  btn.innerText = 'Signing...'
  
  const { error } = await supabase.from('signatures').insert([{ name, email, phone, reason }])
  
  if(error) {
    msg.innerHTML = '<p class="error">Error: ' + error.message + '</p>'
    btn.disabled = false
    btn.innerText = 'Sign Petition'
  } else {
    msg.innerHTML = '<p class="success">Thank you for signing!</p>'
    loadCount()
    document.getElementById('petitionForm').reset()
    btn.disabled = false
    btn.innerText = 'Sign Petition'
  }
})
</script>

</body>
</html>
